<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoMpaNeoN AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Auth Screen -->
        <div id="authScreen" class="screen active">
            <div class="auth-container">
                <h1>🤖 CoMpaNeoN AI</h1>
                <p>Your personal AI, trained on your own data.</p>
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Login</button>
                    <button class="auth-tab" data-tab="signup">Sign Up</button>
                </div>
                <div id="loginForm" class="auth-form active">
                    <input type="text" id="loginPhone" placeholder="Phone (e.g. +234...)" />
                    <input type="password" id="loginPassword" placeholder="Password" />
                    <button id="btnLogin" class="primary-btn">Login</button>
                </div>
                <div id="signupForm" class="auth-form">
                    <input type="text" id="signupFullName" placeholder="Full Name" maxlength="200" />
                    <input type="text" id="signupPhone" placeholder="Phone (e.g. +234...)" maxlength="200" />
                    <input type="password" id="signupPassword" placeholder="Password" maxlength="200" />
                    <select id="signupCountry">
                        <optgroup label="Africa">
                            <option value="Nigeria">Nigeria (+234)</option>
                            <option value="Ghana">Ghana (+233)</option>
                            <option value="Kenya">Kenya (+254)</option>
                            <option value="South Africa">South Africa (+27)</option>
                            <option value="Egypt">Egypt (+20)</option>
                            <option value="Ethiopia">Ethiopia (+251)</option>
                            <option value="Morocco">Morocco (+212)</option>
                            <option value="Cameroon">Cameroon (+237)</option>
                            <option value="Ivory Coast">Ivory Coast (+225)</option>
                            <option value="Uganda">Uganda (+256)</option>
                        </optgroup>
                        <optgroup label="Global">
                            <option value="United States">United States (+1)</option>
                            <option value="United Kingdom">United Kingdom (+44)</option>
                            <option value="India">India (+91)</option>
                            <option value="Canada">Canada (+1)</option>
                            <option value="Australia">Australia (+61)</option>
                            <option value="Germany">Germany (+49)</option>
                            <option value="France">France (+33)</option>
                            <option value="China">China (+86)</option>
                            <option value="Brazil">Brazil (+55)</option>
                            <option value="United Arab Emirates">United Arab Emirates (+971)</option>
                        </optgroup>
                    </select>
                    <select id="signupTemperament">
                        <option value="sanguine">Sanguine</option>
                        <option value="melancholy">Melancholy</option>
                        <option value="phlegmatic">Phlegmatic</option>
                        <option value="choleric">Choleric</option>
                    </select>
                    <button id="btnSignup" class="primary-btn">Create Account</button>
                </div>
            </div>
        </div>

        <!-- Main App Screen -->
        <div id="mainScreen" class="screen">
            <header class="top-header">
                <button id="btnSettings" class="icon-btn">⚙️</button>
                <h1>CoMpaNeoN AI</h1>
                <button id="btnLogout" class="icon-btn">⎋</button>
            </header>

            <div class="workspace-tabs" id="workspaceTabs">
                <!-- Workspace tabs appear here dynamically via JS -->
            </div>

            <main class="chat-box" id="chatBox">
                <!-- Messages appear here dynamically via JS -->
            </main>

            <!-- Research Panel -->
            <div class="research-panel" id="researchPanel" style="display:none;">
                <div class="research-header">
                    <h3>🔍 Research Summary Engine</h3>
                    <button id="btnCloseResearch" class="icon-btn">✕</button>
                </div>
                <div id="researchResults" class="research-results"></div>
            </div>

            <footer class="input-area">
                <input type="text" id="promptInput" placeholder="Start a chat with CoMpaNeoN!!" />
                <button id="btnSend" class="send-btn">➤</button>
            </footer>

            <nav class="bottom-nav">
                <a href="#" data-action="home" class="nav-link active">🏠</a>
                <a href="#" data-action="research" class="nav-link">🔍</a>
                <a href="#" data-action="workspace" class="nav-link">📁</a>
                <a href="#" data-action="train" class="nav-link">🪄</a>
            </nav>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal" style="display:none;">
            <div class="modal-content">
                <h3>Settings</h3>
                <label style="display:block; margin: 0.5rem 0 0.2rem;">Language</label>
                <select id="settingsLanguage" style="width:100%; padding:0.6rem; margin-bottom:1rem; border-radius:0.5rem; border:1px solid var(--border);">
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="ar">Arabic</option>
                    <option value="zh">Chinese</option>
                </select>
                <label style="display:block; margin: 0.5rem 0 0.2rem;">Temperament</label>
                <select id="settingsTemperament" style="width:100%; padding:0.6rem; margin-bottom:1.5rem; border-radius:0.5rem; border:1px solid var(--border);">
                    <option value="sanguine">Sanguine</option>
                    <option value="melancholy">Melancholy</option>
                    <option value="phlegmatic">Phlegmatic</option>
                    <option value="choleric">Choleric</option>
                </select>
                <div style="display:flex; gap:0.5rem;">
                    <button id="btnSaveSettings" class="primary-btn" style="flex:1;">Save</button>
                    <button id="btnCloseSettings" class="primary-btn secondary-btn" style="flex:1;">Close</button>
                </div>
            </div>
        </div>
    </div>

   <script src="js/app.js"></script>
</body>
</html>
